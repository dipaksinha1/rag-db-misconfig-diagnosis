# Baseline ("good") configuration of the TEST database.
#
# This file is the single source of truth for the healthy configuration. It is
# mounted read-only into the container and selected with
# `postgres -c config_file=/etc/pgdiag/postgresql.conf` (see compose.yaml).
#
# Fault injection (T6) must NOT edit this file. It overrides one setting with
# ALTER SYSTEM, which writes PGDATA/postgresql.auto.conf; that file is read
# after this one and therefore wins. `ALTER SYSTEM RESET ALL` plus a reload or
# restart returns the server to exactly what is written here.
#
# Changes to this file take effect on reload (`SELECT pg_reload_conf()`) or,
# for restart-only settings, on `docker compose restart db`.

# --- Connections -------------------------------------------------------------
listen_addresses = '*'            # the image's default config sets this; a custom config_file must too
max_connections = 100

# --- Statistics and instrumentation (needed by the symptom collector, T7) ----
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.track = all    # also count statements inside functions
track_io_timing = on
track_activity_query_size = 4096

# --- Logging -----------------------------------------------------------------
# The logging collector writes into /var/log/pgdiag, which is the host
# directory data/pg_logs/ (bind mount, gitignored). Two files per day:
#   postgresql-YYYY-MM-DD.log    plain text, the format a DBA would read
#   postgresql-YYYY-MM-DD.json   same events as JSON lines, easy to parse
logging_collector = on
log_destination = 'stderr,jsonlog'
log_directory = '/var/log/pgdiag'
log_filename = 'postgresql-%Y-%m-%d.log'
log_file_mode = 0644              # readable from the host without being the postgres uid
log_rotation_age = 1d
log_rotation_size = 0
log_truncate_on_rotation = off
log_timezone = 'UTC'
log_line_prefix = '%m [%p] %q[user=%u,db=%d,app=%a] '

log_min_duration_statement = 250ms   # slow queries
log_temp_files = 0                   # every temporary file, with its size
log_checkpoints = on
log_autovacuum_min_duration = 0      # every autovacuum / autoanalyze run
log_lock_waits = on

# --- The experiment's case settings (pgdiag.settings.CASE_SETTINGS) -----------
# The experiment breaks these six one at a time. The values below are the tuned
# healthy baseline for a container with a 256 MB memory limit (T5b). Keep them
# in this block only.
shared_buffers = 64MB                     # 1/4 of the container; restart required
work_mem = 8MB                            # no workload sort/hash spills; 3 parallel participants x hash_mem_multiplier 2 x 8MB stays small
random_page_cost = 1.1                    # SSD-like storage
max_parallel_workers_per_gather = 2       # 4 host CPUs, no CPU limit
jit_above_cost = 100000                   # default; jit = on (default) and pg_jit_available() is true
default_statistics_target = 100           # default

# --- The other target settings (pgdiag.settings.TARGET_SETTINGS) -------------
# Dropped from the experiment by the project owner (T5b), still indexed by the
# RAG stages. Sane values for a 256 MB container; not broken by any case.
effective_cache_size = 160MB              # shared_buffers + the page cache the container can hold
maintenance_work_mem = 32MB
max_wal_size = 1GB                        # default; a pass writes only a few MB of WAL
autovacuum = on

[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "pgdiag"
version = "0.1.0"
description = "Does RAG help an LLM diagnose PostgreSQL 16 misconfigurations? Research pipeline."
readme = "README.md"
requires-python = ">=3.11"
# Direct dependencies are pinned here; the full resolved set (including
# transitive packages) is pinned in requirements.lock. Each task adds what it
# needs, then runs `make lock`.
# torch must be the CPU-only build: `make setup` passes the PyTorch CPU wheel
# index (https://download.pytorch.org/whl/cpu) to pip, and requirements.lock
# pins `torch==...+cpu`. Without that index pip would fetch the multi-GB CUDA build.
dependencies = [
    "anthropic==2.10.0",
    "httpx==0.28.1",
    "beautifulsoup4==4.15.0",
    "bm25s==0.3.16",
    "chromadb==1.5.9",
    "lxml==6.1.3",
    "numpy==2.5.4",
    "psycopg[binary]==3.3.9",
    "PyStemmer==3.1.0",
    "python-dotenv==1.2.4",
    "PyYAML==6.0.3",
    "requests==2.34.2",
    "sentence-transformers==6.3.0",
    "torch==2.15.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "ruff==0.17.5",
]
# The local web UI (`make ui`); optional, so the pipeline's lock file is unchanged.
ui = [
    "streamlit==1.66.1",
]

# One console script per pipeline stage; each task registers its own here.
[project.scripts]
pgdiag-db = "pgdiag.db:main"
pgdiag-ingest-docs = "pgdiag.ingest.docs.cli:main"
pgdiag-ingest-release-notes = "pgdiag.ingest.release_notes.cli:main"
pgdiag-index = "pgdiag.index.cli:main"
pgdiag-workload = "pgdiag.workload.cli:main"
pgdiag-faults = "pgdiag.faults.cli:main"
pgdiag-collect = "pgdiag.collect.cli:main"
pgdiag-retrieve = "pgdiag.retrieve.cli:main"
pgdiag-diagnose = "pgdiag.diagnose.cli:main"
pgdiag-fixtest = "pgdiag.fixtest.cli:main"
pgdiag-experiment = "pgdiag.experiment.cli:main"
pgdiag-evaluate = "pgdiag.evaluate.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "db: needs the test database from compose.yaml (skipped when unreachable)",
    "network: makes real requests to postgresql.org",
    "llm: calls the Anthropic API (needs ANTHROPIC_API_KEY, costs money)",
    "slow: takes more than a few seconds",
    "data: checks generated files under data/ (skipped with instructions when they are absent)",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
